<title>Signature card</title>
<!-- Source for assets/signature/gilang-jecko-signature.gif. Open it to watch the loop.
     The GIF is recorded from this page with ?capture, which pauses every animation and steps it frame by frame.
     Frame 0 is the finished design, because Outlook on Windows only ever shows the first frame. -->
<style>
@font-face { font-family:'Space Grotesk'; font-weight:300 600; src:url(../assets/fonts/space-grotesk-latin.woff2) format('woff2'); }
@font-face { font-family:'Instrument Serif'; font-style:italic; src:url(../assets/fonts/instrument-serif-italic-latin.woff2) format('woff2'); }

:root { --loop:6s; --ease:cubic-bezier(.2,.7,.25,1); }
html,body { margin:0; }
body { min-height:100vh; display:grid; place-items:center; background:#e9e9ec; }
body.capture { min-height:0; display:block; background:transparent; }
body.capture .card { margin:0; }

.card { position:relative; width:520px; height:188px; border-radius:16px; overflow:hidden; background:linear-gradient(145deg,#1f1f24 0%,#131316 58%,#0c0c0e 100%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), inset 0 1px 0 rgba(255,255,255,.14); font-family:'Space Grotesk',sans-serif; color:#f7f6f8; -webkit-font-smoothing:antialiased; }

/* Left: who and how to reach. */
.info { position:absolute; left:24px; top:20px; bottom:18px; width:318px; display:flex; flex-direction:column; }
.name { margin:0; font-size:34px; font-weight:600; line-height:.9; letter-spacing:-.06em; }
.role { margin:8px 0 0; color:#c4c4cb; font-size:12.5px; line-height:1.3; letter-spacing:.005em; }
.tag { margin:2px 0 0; color:#9a9aa3; font-size:12.5px; line-height:1.3; }
.tag em { margin:0 -.08em; padding:0 .08em; font-family:'Instrument Serif',serif; font-size:16.5px; font-style:italic; letter-spacing:0;
  background-image:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 58%),linear-gradient(110deg,#7ff3dc 0%,#63c9ff 34%,#6f86ff 66%,#a07cff 100%);
  background-size:260% 100%,100% 100%; background-repeat:no-repeat; background-position:100% 0,0 0;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:streak var(--loop) linear infinite; }

.rule { position:relative; height:1px; margin-top:auto; overflow:hidden; background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.04)); }
.rule i { position:absolute; top:0; left:0; width:110px; height:1px; background:linear-gradient(90deg,transparent,#7ff3dc 25%,#63c9ff 45%,#6f86ff 65%,#a07cff 82%,transparent); transform:translateX(-120px); animation:sweep var(--loop) linear infinite; }

.contacts { display:grid; gap:5px; margin:11px 0 0; padding:0; list-style:none; }
.contacts li { display:flex; align-items:center; gap:9px; color:#c4c4cb; font-size:11.5px; line-height:14px; letter-spacing:.01em; font-variant-numeric:tabular-nums; }
.contacts svg { flex:none; width:14px; height:14px; fill:none; stroke:#7ff3dc; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

/* Right: the GJ mark, large, on the site's soft glow. */
.brand { position:absolute; top:0; right:0; bottom:0; width:160px; border-left:1px solid rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; }
.brand::before { content:""; position:absolute; inset:-20px -30px; background:radial-gradient(closest-side at 50% 50%,rgba(127,243,220,.12),rgba(127,243,220,0) 70%),radial-gradient(closest-side at 50% 50%,rgba(126,112,255,.34) 0%,rgba(118,118,255,.24) 22%,rgba(104,132,255,.13) 46%,rgba(64,76,196,.04) 72%,rgba(31,36,112,0) 100%); }
.mark { position:relative; width:92px; height:92px; overflow:visible; }
.mark .fill { fill:#f5f5f2; animation:fill-dim var(--loop) linear infinite; }
.mark .trace { fill:none; stroke:url(#trace); stroke-width:.7; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:.2 .8; stroke-opacity:0; animation:trace-move var(--loop) linear infinite, trace-fade var(--loop) linear infinite; }

/* One 6s loop. Every animation is at rest at 0% and 100%, so the first frame reads as the finished card. */
@keyframes trace-move { 0%,8% { stroke-dashoffset:0; animation-timing-function:cubic-bezier(.45,0,.35,1); } 40%,100% { stroke-dashoffset:-1; } }
@keyframes trace-fade { 0%,8% { stroke-opacity:0; } 13%,34% { stroke-opacity:1; } 40%,100% { stroke-opacity:0; } }
@keyframes fill-dim { 0%,8% { fill-opacity:1; } 14%,32% { fill-opacity:.16; } 42%,100% { fill-opacity:1; } }
@keyframes streak { 0%,30% { background-position:100% 0,0 0; animation-timing-function:cubic-bezier(.45,0,.35,1); } 50%,100% { background-position:0% 0,0 0; } }
@keyframes sweep { 0%,44% { transform:translateX(-120px); animation-timing-function:cubic-bezier(.45,0,.35,1); } 72%,100% { transform:translateX(330px); } }

@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
